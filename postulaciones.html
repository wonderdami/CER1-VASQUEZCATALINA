  <!--CSS-->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" alt="Huellas del Puerto" height="75">

          </li>
        </ul>
      </div>
    </div>
  </nav>
  <main>
  <h1 class="text-center my-4">Formulario de Adopción</h1>
  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <form class="card p-4 shadow-sm card-color">      
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
          </div>
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+56912345678" required>
          </div>
          <div class="mb-3">
            <label for="mascota" class="form-label">Mascota de interés</label>
            <select class="form-select" id="mascota" name="mascota" required>
              <option value="" selected disabled>Selecciona una mascota...</option>
              <option value="chester">Chester</option>
              <option value="ramon">Ramón</option>
              <option value="nova">Nova</option>
              <option value="chiquilla">Chiquilla</option>
              <option value="baron">Barón</option>
              <option value="marita">Marita</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="edad" class="form-label">Edad del adoptante</label>
            <input type="number" class="form-control" id="edad" name="edad" min="18" placeholder="Ej: 25" required>
          </div>
          <div class="mb-3">
            <label for="vivienda" class="form-label">Tipo de vivienda</label>
            <select class="form-select" id="vivienda" name="vivienda" required>
              <option value="" selected disabled>Selecciona tipo de vivienda...</option>
              <option value="casa">Casa</option>
              <option value="departamento">Departamento</option>
              <option value="loft">Loft</option>
              <option value="terreno">Terreno</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="tiene_mascotas" class="form-label">¿Tiene mascotas actualmente?</label>
            <select class="form-select" id="tiene_mascotas" name="tiene_mascotas" required>
              <option value="" selected disabled>Selecciona una opción...</option>
              <option value="si">Sí</option>
              <option value="no">No</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="motivo" class="form-label">Motivo de adopción</label>
            <textarea class="form-control" id="motivo" name="motivo" rows="3" required></textarea>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="compromiso" required>
            <label for="compromiso" class="form-check-label">Al marcar esta casilla, usted acepta el compromiso de tenencia responsable</label>
          </div>
          <button type="submit" class="btn btn-primary d-block mx-auto">Enviar Solicitud</button>
        </form>
      </div>
    </div>
  </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
